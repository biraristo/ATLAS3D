<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101923"><title>ATLAS3D — 3D Yolculuk Haritası</title><link href="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.css" rel="stylesheet"><link rel="stylesheet" href="./style.css"></head>
<body><div id="map" role="application" aria-label="Üç boyutlu arazi haritası"></div><header class="top"><div><strong>ATLAS<span>3D</span></strong><small>Canlı arazi keşfi</small></div><span class="tag">BETA 0.1</span></header><div id="notice" class="notice" role="status">3D arazi yükleniyor…</div><div class="controls"><button id="locate" aria-label="Konumumu bul" title="Konumumu bul">◎</button><button id="follow" aria-label="Konumumu takip et" title="Takip">➤</button><button id="reset" aria-label="Kamera açısını sıfırla" title="3D görünüm">3D</button></div><section class="panel"><div class="panel-head"><div><small>ARAZİ KEŞFİ</small><h1 id="status">Bolu Dağı</h1></div><span id="gps" class="pill">GPS kapalı</span></div><div class="stats"><div><small>ARAZİ RAKIMI</small><b id="altitude">—</b></div><div><small>KONUM</small><b id="coords">—</b></div></div><p id="hint">Haritayı sürükleyin, döndürün veya konumunuzu açın. Rakım, seçili harita noktasındaki arazi yüksekliğidir.</p><button id="bolu" class="secondary">Bolu Dağı'na dön</button></section><script src="https://api.mapbox.com/mapbox-gl-js/v3.16.0/mapbox-gl.js"></script><script src="./app.js"></script></body></html>
