name: ATLAS3D Live Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and site files
        run: |
          for f in app.js analysis.js terrain.js traffic.js tolls.js ferries.js sw.js; do node --check "$f"; done
          node --input-type=module --check < worker.js
          # index.html'de çağrılan her yerel betik depoda olmalı
          for f in $(grep -o 'src="\./[^"]*"' index.html | cut -d'"' -f2); do test -s "$f" || { echo "Eksik: $f"; exit 1; }; done
          test -s index.html
          test -s style.css
          test -s wrangler.toml

      - name: Check the publicly deployed app
        shell: bash
        run: |
          set -euo pipefail
          base="https://atlas3d.bunyaminatalay07.workers.dev"
          for attempt in {1..12}; do
            if curl --fail --location --silent --show-error --max-time 15 "$base/api/health" -o /tmp/atlas-health.json; then
              if node -e 'const h=require("/tmp/atlas-health.json"); if(h.status!=="ok"||!("rateLimit" in h))process.exit(1)'; then
                break
              fi
            fi
            if [ "$attempt" -eq 12 ]; then echo "Health endpoint failed"; exit 1; fi
            sleep 10
          done
          curl --fail --location --silent --show-error --max-time 20 "$base/" -o /tmp/atlas-index.html
          grep -q "ATLAS3D" /tmp/atlas-index.html
          curl --fail --location --silent --show-error --max-time 20 "$base/app.js" -o /tmp/atlas-app.js
          grep -q "maplibregl" /tmp/atlas-app.js
          node --check /tmp/atlas-app.js
          # Kaynak dosyalar yayınlanmamalı
          for p in worker.js wrangler.toml .github/workflows/atlas3d-smoke.yml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/$p"); [ "$code" = 404 ] || { echo "$p yayında ($code)"; exit 1; }
          done
          echo "ATLAS3D live HTTP smoke test passed."
